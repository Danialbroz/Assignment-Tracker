<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F1EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before paint
  try {
    var s = JSON.parse(localStorage.getItem('ledger.v1') || 'null');
    var t = s && s.settings && s.settings.theme;
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --paper: #F4F1EA;
  --paper-2: #ECE8DE;
  --ink: #1B1B18;
  --ink-2: #45423B;
  --muted: #6B675E;
  --rule: #D9D4C7;
  --rule-strong: #B9B3A4;
  --accent: #7C4DDB;        /* markers, bars */
  --accent-ink: #5B34B0;    /* accent text (AA on paper) */
  --accent-btn: #6D3FD0;    /* primary action fill (AA with white) */
  --on-accent: #FFFFFF;
  --c-ochre: #B08A3E;
  --c-sage: #7F9171;
  --c-slate: #5D7189;
  --c-clay: #B06A50;
  --c-plum: #7E5A72;
  --c-teal: #3F7C78;
  --c-coral: #FF5A5F; --c-tangerine: #FF8A1F; --c-sunny: #F5A700; --c-lime: #7CC21B; --c-emerald: #12B76A;
  --c-aqua: #14B8C8; --c-sky: #2E90FA; --c-indigo: #5B5BF0; --c-violet: #9B51E0; --c-magenta: #E83FB5;
  --hatch: repeating-linear-gradient(135deg, rgba(27,27,24,.13) 0 1px, transparent 1px 6px);
  --serif: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --sans: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --radius: 2px;
  --rail: 320px;
  --ease: 120ms ease;
}
[data-theme="dark"] {
  --paper: #181816;
  --paper-2: #21211E;
  --ink: #E8E4DA;
  --ink-2: #C9C4B8;
  --muted: #A29D91;
  --rule: #34332F;
  --rule-strong: #4C4A44;
  --accent: #A184F0;
  --accent-ink: #B8A0F5;
  --accent-btn: #A184F0;
  --on-accent: #181816;
  --c-ochre: #C49F55;
  --c-sage: #93A585;
  --c-slate: #7A8EA6;
  --c-clay: #C47F64;
  --c-plum: #9C7690;
  --c-teal: #5A9894;
  --hatch: repeating-linear-gradient(135deg, rgba(232,228,218,.12) 0 1px, transparent 1px 6px);
}

/* =========================================================
   BASE
   ========================================================= */
* { box-sizing: border-box; }
html { color-scheme: light; }
[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.5 var(--sans);
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
  transition: background var(--ease), color var(--ease);
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); }
.accent { color: var(--accent-ink); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -40px; background: var(--ink); color: var(--paper); padding: 6px 10px; z-index: 100; }
.skip:focus { top: 8px; }
.sq { display: inline-block; width: 8px; height: 8px; background: var(--c, var(--muted)); flex: none; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid currentColor; border-radius: var(--radius); padding: 0 4px; line-height: 16px; opacity: .75; }
svg.i { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.25; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--ink); background: transparent;
  padding: 5px 10px; border-radius: var(--radius); cursor: pointer;
  font-size: 13px; font-weight: 500; line-height: 1.3;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--accent-btn); border-color: var(--accent-btn); color: var(--on-accent); }
.btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.quiet { border-color: var(--rule-strong); }
.btn.quiet:hover { border-color: var(--ink); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: default; pointer-events: none; }
.link-btn {
  background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-strong);
  transition: text-decoration-color var(--ease);
}
.link-btn:hover { text-decoration-color: currentColor; }
.danger { color: var(--accent-ink); }

input[type="text"], input[type="number"], input[type="search"], input[type="url"],
input[type="date"], input[type="datetime-local"], select, textarea {
  background: transparent; border: 1px solid var(--rule-strong); border-radius: var(--radius);
  padding: 5px 7px; transition: border-color var(--ease); min-width: 0;
}
input:hover, select:hover, textarea:hover { border-color: var(--ink-2); }
select option { background: var(--paper); color: var(--ink); }
input[type="number"] { font-family: var(--mono); font-size: 12.5px; }
input[type="date"], input[type="datetime-local"] { font-family: var(--mono); font-size: 12.5px; }

input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 0;
  width: 14px; height: 14px; border: 1px solid var(--ink); border-radius: var(--radius);
  display: inline-grid; place-content: center; cursor: pointer; background: transparent;
  transition: background var(--ease); vertical-align: -2px;
}
input[type="checkbox"]::before {
  content: ""; width: 8px; height: 8px; transform: scale(0);
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  background: var(--paper); transition: transform var(--ease);
}
input[type="checkbox"]:checked { background: var(--ink); }
input[type="checkbox"]:checked::before { transform: scale(1); }

/* =========================================================
   LAYOUT
   ========================================================= */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  border-right: 1px solid var(--rule); position: sticky; top: 0; height: 100vh;
  overflow-y: auto; display: flex; flex-direction: column; background: var(--paper);
}
.rail-top { padding: 22px 18px 14px; border-bottom: 1px solid var(--rule); }
.rail-brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.wordmark { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -.015em; margin: 0; line-height: 1; }
.term { color: var(--muted); margin: 6px 0 14px; }
.rail-actions { display: flex; gap: 8px; align-items: center; }
.menu-btn { display: none; }
.rail-body { padding: 0 18px 24px; flex: 1; }
.rail-sec { padding-top: 18px; }
.rail-h { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.nav, .courses, .reminders { list-style: none; margin: 0; padding: 0; }
.nav a, .courses a {
  display: flex; align-items: center; gap: 8px; padding: 4px 0; text-decoration: none;
  border-bottom: 1px solid transparent; transition: color var(--ease);
}
.nav a { justify-content: space-between; font-size: 14px; }
.nav a .mono { color: var(--muted); font-size: 10.5px; }
.nav a[aria-current="page"] { font-weight: 600; }
.nav a, .courses a { position: relative; }
.nav a[aria-current="page"]::before, .courses a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 50%; width: 7px; height: 1px; background: var(--accent); }
.nav a:hover, .courses a:hover { color: var(--ink-2); }
.courses a { font-size: 13.5px; transform-origin: left center; transform: translateX(calc(var(--m, 0) * 8px)) scale(calc(1 + var(--m, 0) * .07)); transition: transform .35s cubic-bezier(.22,1,.36,1), color var(--ease); }
@media (prefers-reduced-motion: reduce) { .courses a { transform: none; } }
.courses .code { font-size: 11.5px; flex: none; }
.courses .cname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.courses .cnt { color: var(--muted); font-size: 11.5px; }
.courses { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding-right: 16px; } /* room for the hover pop-out before the rail border */
.courses a { padding: 9px 12px; border: 1px solid var(--rule); border-radius: 12px; background: color-mix(in srgb, var(--paper) 55%, transparent); transition: transform .35s cubic-bezier(.22,1,.36,1), color var(--ease), border-color .25s ease, box-shadow .25s ease; }
.courses a:hover, .courses a:focus-visible { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 22%, transparent); }
.courses a[aria-current="page"] { border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
.courses a[aria-current="page"]::before { display: none; }
.reminders li { padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13px; line-height: 1.35; }
.reminders li:last-child { border-bottom: 0; }
.reminders .mono { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.rail-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; }
.rail-foot .link-btn { color: var(--ink-2); }

main { padding: 34px 48px 120px; min-width: 0; outline: none; }
.page { max-width: 1120px; }
.page-head { border-bottom: 1px solid var(--ink); padding-bottom: 16px; margin-bottom: 30px; }
.eyebrow { margin: 0 0 8px; color: var(--muted); }
.display { font-family: var(--serif); font-weight: 400; font-size: clamp(36px, 5.2vw, 58px); line-height: 1.02; letter-spacing: -.02em; margin: 0; }
.meta { margin: 12px 0 0; color: var(--ink-2); }
.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.section-h { font-family: var(--serif); font-size: 21px; font-weight: 500; margin: 0 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; letter-spacing: -.005em; }
.section-h .mono { color: var(--muted); font-weight: 400; }
section + section { margin-top: 44px; }
.empty { padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--ink-2); }

/* =========================================================
   TODAY
   ========================================================= */
.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 56px; align-items: start; }
.now-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.now-item {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 14px;
  padding: 14px 0 13px; border-bottom: 1px solid var(--rule); align-items: baseline;
}
.now-item:focus-visible { outline-offset: -2px; }
.rank { font-family: var(--serif); font-size: 30px; line-height: .9; grid-row: span 2; }
.now-title { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.now-title .title-link { font-size: 17px; font-weight: 500; }
.now-title .mono { color: var(--muted); }
.reason { color: var(--ink-2); margin: 0; }
.reason.late { color: var(--accent-ink); }
.title-link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: none; }
.title-link:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }

.side-block + .side-block { margin-top: 34px; }
.side-h { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
.load-mini { list-style: none; margin: 0; padding: 0; }
.load-mini li { display: grid; grid-template-columns: 70px 1fr 38px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.load-mini .track { height: 6px; position: relative; }
.load-mini .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-2); }
.load-mini .fill.over { background: var(--accent); }
.load-mini .capmark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink); }
.load-mini .h { text-align: right; }
.load-mini li.is-today .mono:first-child { color: var(--accent-ink); }
.done-list { list-style: none; margin: 0; padding: 0; }
.done-list li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.done-list li span.t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule-strong); flex: 1; min-width: 0; }

/* Ledger tables */
table { border-collapse: collapse; width: 100%; }
.ledger th, .ledger td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: baseline; }
.ledger th:last-child, .ledger td:last-child { padding-right: 0; }
.ledger thead th { font: 400 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid var(--ink); padding-top: 0; white-space: nowrap; }
.ledger .group th { padding-top: 22px; padding-bottom: 6px; font-family: var(--serif); font-size: 16px; font-weight: 500; border-bottom: 1px solid var(--rule-strong); }
.ledger .group th .mono { color: var(--muted); font-weight: 400; margin-left: 10px; }
.ledger .group.late th { color: var(--accent-ink); }
.ledger .num { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.ledger td.due { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.ledger td.cb { width: 26px; }
.ledger td.course-cell { white-space: nowrap; width: 1%; }
.ledger td.course-cell .code { margin-left: 7px; color: var(--ink-2); font-size: 11.5px; }
.ledger tr.row { transition: background var(--ease); }
.ledger tr.row:hover { background: var(--paper-2); }
.ledger tr.row:focus-visible { outline-offset: -2px; }
.ledger tr.overdue td, .ledger tr.overdue .title-link { color: var(--accent-ink); }
.ledger tr.done .title-link { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.ledger tr.leaving td { opacity: 0; padding-top: 0; padding-bottom: 0; line-height: 0; font-size: 0; transition: all 180ms ease; }
.ledger tr.leaving td * { font-size: 0; height: 0; }
.ledger .tot td { border-top: 1px solid var(--ink); border-bottom: 0; font-weight: 600; }
.sort-btn { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sort-btn:hover { color: var(--ink); }
th[aria-sort] .sort-btn { color: var(--ink); }

/* =========================================================
   WEEK
   ========================================================= */
.week-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.week-tools label { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; color: var(--ink-2); font-size: 13px; }
.week-tools input[type="number"] { width: 58px; }
/* Timetable: one row per day, 30-minute columns; overlapping classes stack via grid auto-placement */
.tt-wrap { overflow-x: auto; margin-top: 8px; border: 1px solid var(--rule); border-radius: 16px; background: color-mix(in srgb, var(--paper) 55%, transparent); }
.tt { min-width: 880px; }
.tt-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.tt-row:last-child { border-bottom: 0; }
.tt-dl { padding: 12px 14px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--rule); }
.tt-row.is-today .tt-dl { color: var(--accent-ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.tt-hours { display: grid; grid-template-columns: repeat(var(--slots), minmax(0, 1fr)); }
.tt-hours span.half { border-left-style: dashed; }
.tt-hours span { padding: 10px 4px; font-size: 10px; white-space: nowrap; overflow: hidden; color: var(--muted); border-left: 1px solid var(--rule); }
.tt-lane { display: grid; grid-template-columns: repeat(var(--slots), minmax(0, 1fr)); grid-auto-rows: minmax(88px, auto); row-gap: 6px; padding: 6px 0; min-height: 100px;
  background-image: repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px calc(200% / var(--slots))),
    repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px calc(100% / var(--slots))); }
.tt-cls { display: grid; align-content: start; gap: 2px; margin: 0 3px; padding: 8px 10px; border: 0; border-radius: 10px; text-align: left; cursor: pointer; overflow: hidden;
  background: var(--c); color: #fff; font: 500 12px/1.35 var(--sans); box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 30%, transparent); transition: transform .2s ease, box-shadow .2s ease; }
.tt-cls:hover, .tt-cls:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in srgb, var(--c) 45%, transparent); }
.tt-cls b { font: 600 12.5px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-type { font-weight: 600; }
.tt-cls em { font-style: normal; opacity: .85; }
.tt-cls span { opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { .tt-cls { transition: none; } .tt-cls:hover { transform: none; } }
.strip-wrap { margin-bottom: 4px; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 120px; position: relative; border-bottom: 1px solid var(--ink); }
.strip-col { position: relative; display: flex; align-items: flex-end; justify-content: center; border-right: 1px solid var(--rule); }
.strip-col:last-child { border-right: 0; }
.strip-bar { width: 34%; min-height: 0; background: var(--ink-2); transition: height var(--ease); }
.strip-bar.over { background: var(--accent); }
.cap-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink); pointer-events: none; }
.cap-line span { position: absolute; right: 0; top: -17px; font: 10.5px var(--mono); color: var(--ink-2); background: var(--paper); padding-left: 4px; }
.strip-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.strip-labels div { text-align: center; padding: 4px 0; font: 11.5px var(--mono); color: var(--ink-2); }
.strip-labels div.over { color: var(--accent-ink); font-weight: 500; }
.suggest { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--rule); margin: 6px 0 22px; }
.suggest p { margin: 0; }
.suggest::before { content: ""; width: 8px; height: 8px; background: var(--accent); flex: none; }
.week-cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-left: 1px solid var(--rule); }
.w-col { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-height: 300px; padding: 0 0 10px; transition: background var(--ease); }
.w-col.drop { background: var(--paper-2); }
.w-head { padding: 8px 10px 8px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
.w-head .d { font-family: var(--serif); font-size: 22px; line-height: 1; }
.w-head .wd { font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.w-col.is-today .w-head { box-shadow: inset 0 2px 0 var(--accent); }
.w-col.is-today .w-head .wd { color: var(--accent-ink); }
.w-col.past { background: transparent; }
.w-col.past .w-head .d { color: var(--muted); }
.w-entry {
  margin: 8px 8px 0; padding: 5px 0 6px 8px; border-left: 3px solid var(--c);
  border-bottom: 1px solid var(--rule); cursor: grab; font-size: 13px; line-height: 1.3;
  transition: background var(--ease);
}
.w-entry:hover { background: var(--paper-2); }
.w-entry:active { cursor: grabbing; }
.w-entry .mono { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
.w-entry .t { display: block; overflow-wrap: anywhere; }
.w-entry.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.w-entry.overdue .t, .w-entry.overdue .mono { color: var(--accent-ink); }
.w-entry.dragging { opacity: .4; }
.w-empty { padding: 10px; color: var(--muted); font-size: 12px; }

/* =========================================================
   SEMESTER TIMELINE
   ========================================================= */
.sem-tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.sem-tools label { display: inline-flex; gap: 6px; align-items: center; }
.tl-scroll { overflow-x: auto; border-top: 1px solid var(--ink); }
.tl { min-width: 860px; }
.tl-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.tl-label { padding: 10px 12px 10px 0; display: flex; gap: 8px; align-items: center; font-size: 13px; min-width: 0; }
.tl-label a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-label a:hover { text-decoration: underline; text-underline-offset: 3px; }
.tl-label .code { font-size: 11.5px; }
.tl-track { position: relative; height: 72px; }
.tl-head .tl-track { height: 56px; }
.tl-head .tl-label { color: var(--muted); }
.tl-wk { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--rule); }
.tl-wk-label { position: absolute; top: 6px; font: 10.5px/1.3 var(--mono); color: var(--muted); padding-left: 5px; white-space: nowrap; }
.tl-wk-label b { display: block; color: var(--ink); font-weight: 500; }
.tl-band { position: absolute; top: 0; bottom: 0; background-image: var(--hatch); }
.tl-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--accent); z-index: 2; }
.tl-head .tl-today::after { content: "Today"; position: absolute; bottom: 2px; left: 4px; font: 10px var(--mono); color: var(--accent-ink); }
.tick {
  position: absolute; bottom: 14px; width: 5px; margin-left: -2px; padding: 0;
  background: var(--c); border: 0; border-radius: 0; cursor: pointer; z-index: 3;
  transition: opacity var(--ease), transform var(--ease);
}
.tick:hover { transform: scaleX(1.6); }
.tick.done { opacity: .38; }
.tick.overdue { outline: 1px solid var(--accent); outline-offset: 1px; }
.tl-legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; color: var(--ink-2); font-size: 12.5px; }
.tl-legend span { display: inline-flex; align-items: center; gap: 7px; }
.swatch-hatch { width: 18px; height: 12px; background-image: var(--hatch); border: 1px solid var(--rule-strong); }
.swatch-tick { width: 4px; height: 12px; background: var(--ink-2); }

/* =========================================================
   COURSE PAGE
   ========================================================= */
.course-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
.plain-input { border: 0 !important; border-bottom: 1px solid transparent !important; border-radius: 0 !important; padding: 0 !important; background: transparent; width: 100%; }
.plain-input:hover { border-bottom-color: var(--rule-strong) !important; }
.plain-input:focus { border-bottom-color: var(--ink) !important; outline: none; }
.plain-input.display { font-size: clamp(32px, 4.6vw, 52px); }
.course-meta { display: flex; gap: 18px; align-items: center; margin-top: 10px; flex-wrap: wrap; color: var(--ink-2); }
.course-meta .plain-input { width: auto; min-width: 80px; }
.course-meta .code-in { font-family: var(--mono); font-size: 13px; width: 90px; }
.course-meta .inst-in { width: 220px; }
.colour-pick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.col-pop { box-sizing: border-box; grid-template-columns: minmax(0, 1fr); overflow: hidden; position: fixed; z-index: 90; width: 212px; padding: 14px; background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.28); display: grid; gap: 12px; animation: qFade .18s ease both; }
.cp-wheel { position: relative; width: 184px; height: 184px; border-radius: 50%; touch-action: none; cursor: crosshair; background: radial-gradient(circle closest-side, #fff, transparent), conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.cp-wheel::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #000; opacity: var(--dim, 0); pointer-events: none; }
.cp-dot { position: absolute; z-index: 1; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.4); pointer-events: none; }
.cp-v { -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 6px; border: 0; padding: 0; background: linear-gradient(90deg, #000, var(--hue, #fff)); }
.cp-v::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.45); cursor: pointer; }
.cp-v::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.45); cursor: pointer; }
.cp-row { min-width: 0; display: flex; gap: 8px; align-items: center; }
.cp-prev { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule-strong); }
.cp-hex { flex: 1; width: 0; min-width: 0; box-sizing: border-box; font-family: var(--mono); text-transform: uppercase; }
.colour-custom { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border: 1px solid var(--rule-strong); border-radius: 999px; background: none; cursor: pointer; font: 500 12px var(--sans); color: var(--ink-2); transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color var(--ease); }
.colour-custom:hover { transform: scale(1.06); border-color: var(--ink); }
.colour-custom i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.colour-custom[aria-pressed="true"] { border-color: var(--ink); }
.colour-custom[aria-pressed="true"] i { background: var(--c); }
.colour-pick button:not(.colour-custom) { width: 22px; height: 22px; border: 0; padding: 0; background: linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); cursor: pointer; border-radius: 50%; box-shadow: 0 2px 6px color-mix(in srgb, var(--c) 45%, transparent); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.colour-pick button:not(.colour-custom):hover { transform: scale(1.18); }
.colour-pick button:not(.colour-custom)[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.course-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 56px; align-items: start; }
.wt-table input[type="text"] { width: 100%; border-color: transparent; padding-left: 0; }
.wt-table input[type="text"]:hover, .wt-table input[type="text"]:focus { border-color: var(--rule-strong); padding-left: 7px; }
.wt-table input[type="number"] { width: 64px; text-align: right; }
.grade-figure { font-family: var(--serif); font-size: 64px; line-height: 1; letter-spacing: -.02em; margin: 4px 0 6px; }
.grade-figure small { font-size: 26px; color: var(--muted); }
.calc { border-top: 1px solid var(--rule); margin-top: 18px; padding-top: 14px; }
.calc label { display: inline-flex; align-items: center; gap: 8px; }
.calc input { width: 70px; }
.calc p { margin: 10px 0 0; font-size: 15px; }
.calc .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.status-tag { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }

/* =========================================================
   DRAWER
   ========================================================= */
.drawer {
  position: fixed; top: 0; right: 0; width: 480px; max-width: 100vw; height: 100vh; height: 100dvh;
  background: var(--paper); border-left: 1px solid var(--ink); z-index: 40; overflow-y: auto;
  transform: translateX(100%); visibility: hidden;
  transition: transform 160ms ease, visibility 0s linear 160ms;
}
.drawer.open { transform: none; visibility: visible; transition: transform 160ms ease, visibility 0s; }
.d-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 2; }
.d-head .left { display: flex; gap: 8px; align-items: center; }
.d-body { padding: 18px 24px 40px; }
.d-title { font-family: var(--serif); font-size: 28px; line-height: 1.15; letter-spacing: -.01em; width: 100%; border: 0 !important; border-bottom: 1px solid transparent !important; border-radius: 0 !important; padding: 0 0 4px !important; background: transparent; resize: none; overflow: hidden; }
.d-title:focus { border-bottom-color: var(--ink) !important; outline: none; }
.d-status { margin: 6px 0 18px; }
.fields { display: grid; grid-template-columns: 110px minmax(0, 1fr); border-top: 1px solid var(--ink); }
.fields > label, .fields > .lab { padding: 9px 0; border-bottom: 1px solid var(--rule); color: var(--muted); font: 10.5px/22px var(--mono); text-transform: uppercase; letter-spacing: .07em; }
.fields > .val { padding: 6px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 8px; align-items: center; min-width: 0; }
.fields .val input[type="number"] { width: 80px; }
.fields .val select, .fields .val input[type="datetime-local"] { max-width: 100%; }
.d-sec { margin-top: 26px; }
.d-sec h3 { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; }
.sub-list { list-style: none; margin: 0; padding: 0; }
.sub-list li { display: grid; grid-template-columns: 18px minmax(0, 1fr) 132px 22px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.sub-list input[type="text"] { border-color: transparent; padding-left: 0; }
.sub-list input[type="text"]:hover, .sub-list input[type="text"]:focus { border-color: var(--rule-strong); padding-left: 7px; }
.sub-list li.done input[type="text"] { color: var(--muted); text-decoration: line-through; }
.sub-list input[type="date"] { font-size: 11.5px; padding: 3px 4px; }
.icon-btn { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--muted); display: inline-grid; place-content: center; border-radius: var(--radius); }
.icon-btn:hover { color: var(--ink); }
.d-notes { width: 100%; min-height: 110px; resize: vertical; line-height: 1.5; }
.link-list { list-style: none; margin: 0; padding: 0; }
.link-list li { display: grid; grid-template-columns: minmax(0, 1fr) 22px 22px; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.link-list input { font-family: var(--mono); font-size: 12px; border-color: transparent; padding-left: 0; }
.link-list input:hover, .link-list input:focus { border-color: var(--rule-strong); padding-left: 7px; }
.d-foot { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }

/* =========================================================
   QUICK ADD
   ========================================================= */
.quick-scrim {
  position: fixed; inset: 0; z-index: 34; background: rgba(24,18,40,.38);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s .3s;
}
.quick-scrim.open { opacity: 1; visibility: visible; transition: opacity .3s ease; }
.quick {
  position: fixed; top: 50%; left: 50%; z-index: 35; width: min(660px, calc(100vw - 28px)); max-height: 88vh; overflow-y: auto;
  background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1px solid var(--glass-edge); border-radius: 26px;
  padding: 26px 30px 20px; box-shadow: 0 30px 80px rgba(20,12,40,.35), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  opacity: 0; visibility: hidden; transform: translate(-50%, -46%) scale(.92);
  transition: opacity .25s ease, transform .35s ease, visibility 0s .35s;
}
.quick.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); transition: opacity .25s ease, transform .5s cubic-bezier(.34,1.4,.64,1); }
.quick-title { margin: 0 0 14px; font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.quick-foot { flex-wrap: wrap; gap: 12px; margin-top: 22px !important; padding-top: 16px; border-top: 1px solid var(--rule); }
.quick-foot .acts { margin-left: auto; }
.quick-foot .acts .btn { min-width: 96px; justify-content: center; }
/* "Are you sure?" layer */
.q-confirm { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; border-radius: inherit; background: color-mix(in srgb, var(--paper) 70%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: qFade .2s ease both; }
.q-confirm > div { text-align: center; background: var(--paper); border: 1px solid var(--glass-edge); border-radius: 24px; padding: 30px 34px; max-width: 420px; box-shadow: 0 18px 50px rgba(20,12,40,.3); animation: qPop .45s cubic-bezier(.34,1.5,.64,1) both; }
.q-confirm h3 { margin: 0 0 8px; font: 500 30px var(--serif); } .q-confirm p { margin: 0 0 22px; font-size: 18px; color: var(--muted); }
.q-confirm .btn { font-size: 16px; padding: 12px 22px; }
.q-confirm .acts { display: flex; gap: 8px; justify-content: center; }
.q-confirm.fx { position: fixed; z-index: 90; border-radius: 0; }
.q-confirm.fx h3 { font-size: 26px; } .q-confirm.fx p { font-size: 16px; }
.cal-pop { display: none; }
@media (max-width: 760px), (hover: none) and (pointer: coarse) {
  .cal-pop { position: fixed; inset: 0; z-index: 45; display: grid; align-items: end; background: rgba(10,8,20,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .4s; }
  .cal-pop.open { opacity: 1; visibility: visible; transition: opacity .25s ease; }
  .cal-pop-sheet { display: flex; flex-direction: column; gap: 12px; max-height: 78vh; overflow-y: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); background: var(--paper); border: 1px solid var(--glass-edge); border-bottom: 0; border-radius: 24px 24px 0 0; box-shadow: 0 -18px 50px rgba(20,12,40,.35); transform: translateY(100%); transition: transform .5s cubic-bezier(.22,1,.36,1); overscroll-behavior: contain; }
  .cal-pop.open .cal-pop-sheet { transform: none; }
  .cal-pop-grab { width: 40px; height: 5px; border-radius: 99px; background: var(--rule-strong); margin: -6px auto 2px; flex: none; }
}
@keyframes qFade { from { opacity: 0; } } @keyframes qPop { from { opacity: 0; transform: scale(.85) translateY(10px); } }
/* Save celebration */
.q-done { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; border-radius: inherit; background: var(--paper); animation: qFade .25s ease both; }
.q-done svg { width: 84px; height: 84px; } .q-done .ring { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 190; stroke-dashoffset: 190; animation: qDraw .6s .05s ease forwards; transform-origin: center; }
.q-done .tick { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: qDraw .4s .5s ease forwards; }
.q-done b { font: 500 22px var(--serif); animation: qPop .5s .55s cubic-bezier(.34,1.5,.64,1) both; }
@keyframes qDraw { to { stroke-dashoffset: 0; } }
.quick.saved { animation: qSaved .5s .95s cubic-bezier(.5,0,.75,0) forwards; }
@keyframes qSaved { to { opacity: 0; transform: translate(-50%, -56%) scale(.9); } }
@media (prefers-reduced-motion: reduce) { .quick, .quick.open, .q-confirm > div, .q-done b { transition: opacity .2s; animation: none; } }
.quick-input { width: 100%; font-family: var(--serif) !important; font-size: 24px !important; border: 0 !important; border-bottom: 1px solid var(--rule-strong) !important; border-radius: 0 !important; padding: 2px 0 8px !important; }
.quick-input:focus { outline: none; border-bottom-color: var(--ink) !important; }
.chips { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 3px 4px 3px 8px; font-size: 13px; }
.chip > span { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.chip.parsed { border-color: var(--ink); }
.chip.assumed > span::after { content: " · assumed"; color: var(--accent-ink); }
.chip input, .chip select { border: 0 !important; padding: 2px 2px !important; }
.chip input[type="text"] { width: 220px; }
.chip input[type="number"] { width: 54px; }
.quick-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); }
.quick-foot .acts { display: flex; gap: 8px; }

/* =========================================================
   DIALOGS
   ========================================================= */
dialog { border: 1px solid var(--ink); border-radius: var(--radius); background: var(--paper); color: var(--ink); padding: 0; width: min(780px, calc(100vw - 24px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(20, 20, 18, .32); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--paper); z-index: 1; }
.dlg-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; }
.dlg-body { padding: 18px 22px 22px; }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
.keys dl { margin: 0; display: grid; grid-template-columns: 90px 1fr; }
.keys dt, .keys dd { padding: 7px 0; border-bottom: 1px solid var(--rule); margin: 0; }
.keys dt { font-family: var(--mono); font-size: 12px; }
.formula { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--ink); }
.formula h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; margin: 0 0 6px; }
.formula p { margin: 4px 0; color: var(--ink-2); }
.formula code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin-bottom: 14px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px 7px 0; margin-right: 12px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.imp-text { width: 100%; min-height: 150px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
.imp-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.review { margin-top: 16px; overflow-x: auto; }
.review td { padding: 5px 8px 5px 0; }
.review input[type="text"] { width: 100%; min-width: 180px; }
.review input[type="number"] { width: 60px; }
.review tr.rejected td:not(:first-child) { opacity: .4; }
.dlg-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 12px; flex-wrap: wrap; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: var(--radius); font-size: 13px; z-index: 60; display: flex; gap: 14px; align-items: center; }
.toast button { color: var(--paper); }

/* Search */
.search-results mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 1100px) {
  main { padding: 28px 32px 100px; }
  .today-grid { grid-template-columns: 1fr; gap: 40px; }
  .course-grid { grid-template-columns: 1fr; gap: 36px; }
  .quick { padding: 14px 32px 12px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: sticky; top: 0; height: auto; max-height: 100vh; border-right: 0; border-bottom: 1px solid var(--ink); z-index: 25; }
  .rail-top { padding: 12px 16px; border-bottom: 0; }
  .wordmark { font-size: 24px; }
  .term { display: none; }
  .rail-brand { align-items: center; }
  .rail-actions { margin-left: auto; }
  .rail-top-inner { display: flex; align-items: center; gap: 12px; }
  .menu-btn { display: inline-flex; }
  .rail-body { display: none; border-top: 1px solid var(--rule); padding-bottom: 18px; }
  .rail.open .rail-body { display: block; }
  main { padding: 22px 16px 100px; }
  .quick { padding: 18px 16px 14px; }
  .quick-input { font-size: 19px !important; }
  .chip input[type="text"] { width: 160px; }
  .week-cols { grid-template-columns: 1fr; border-left: 0; }
  .w-col { min-height: 0; border-right: 0; }
  .w-col .w-head { justify-content: flex-start; gap: 10px; }
  .ledger .hide-sm { display: none; }
  .ledger td.course-cell .code { display: none; }
  .ledger td.cb { width: 22px; }
  .ledger th, .ledger td { padding-right: 8px; }
  .week-tools label { margin-left: 0; }
  .drawer { width: 100vw; border-left: 0; }
  .d-head, .d-body { padding-left: 16px; padding-right: 16px; }
  .sub-list li { grid-template-columns: 18px minmax(0, 1fr) 22px; }
  .sub-list li input[type="date"] { grid-column: 2; }
  .keys { grid-template-columns: 1fr; }
  .course-head { grid-template-columns: 1fr; }
}
/* Welcome card + bottom tab bar (app-like nav on phones) */
.welcome { border: 1px solid var(--ink); padding: 16px 18px; margin-bottom: 30px; background: var(--paper-2); }
.welcome h2 { margin: 0 0 4px; font-weight: 500; font-size: 24px; }
.welcome p { margin: 4px 0; } .welcome ol { margin: 10px 0; padding-left: 20px; } .welcome li { margin: 4px 0; }
.welcome-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
/* ---- Liquid glass ---- */
:root {
  --glass: rgba(255,255,255,.45); --glass-hi: rgba(255,255,255,.75); --glass-edge: rgba(255,255,255,.65);
  --glass-shadow: 0 8px 28px rgba(27,27,24,.16), 0 1px 2px rgba(27,27,24,.08);
}
[data-theme="dark"] {
  --glass: rgba(60,60,56,.45); --glass-hi: rgba(255,255,255,.18); --glass-edge: rgba(255,255,255,.18);
  --glass-shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
}
body {
  background:

/* Date + time picker */

@keyframes dtpNext { from { opacity: 0; transform: translateX(22px); } } @keyframes dtpPrev { from { opacity: 0; transform: translateX(-22px); } }

@keyframes spotSwing { 0% { transform: rotate(var(--dir, 18deg)); opacity: .5; } 40% { transform: rotate(calc(var(--dir, 18deg) * -.5)); opacity: 1; } 70% { transform: rotate(calc(var(--dir, 18deg) * .2)); } 100% { transform: rotate(0); } }

<script>
'use strict';
/* =========================================================
   UTILITIES
   ========================================================= */
const KEY = 'ledger.v1';
const DAY = 864e5, HOUR = 36e5;
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WDS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MOS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COLOURS = [
  { key: 'coral', name: 'Coral' }, { key: 'tangerine', name: 'Tangerine' }, { key: 'sunny', name: 'Sunny' }, { key: 'lime', name: 'Lime' },
  { key: 'emerald', name: 'Emerald' }, { key: 'aqua', name: 'Aqua' }, { key: 'sky', name: 'Sky' }, { key: 'indigo', name: 'Indigo' },
  { key: 'violet', name: 'Violet' }, { key: 'magenta', name: 'Magenta' }
];
const STATUSES = ['Not started', 'In progress', 'Submitted', 'Graded'];
const FIXED = /\b(exam|midterm|quiz|test|final)\b/i;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 10);
const num = (v, d = 0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = sod(d); return addDays(x, -((x.getDay() + 6) % 7)); };
const dayDiff = (a, b) => Math.round((sod(a) - sod(b)) / DAY);
const sameDay = (a, b) => dayDiff(a, b) === 0;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtShort = d => `${WDS[d.getDay()]} ${d.getDate()} ${MOS[d.getMonth()]}`;
const fmtDM = d => `${d.getDate()} ${MOS[d.getMonth()]}`;
const fmtLong = d => `${WD[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]}`;
const toInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const toDateInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromDateInput = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fromInput = s => { const [dp, tp = '23:59'] = String(s).split('T'); const d = fromDateInput(dp); const [hh, mm] = tp.split(':').map(Number); d.setHours(hh || 0, mm || 0, 0, 0); return d; };
const fmtH = v => `${+(+v || 0).toFixed(1)}h`;
const fmtPct = v => `${+(+v || 0).toFixed(1)}%`;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON = {
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* =========================================================
   STARTING DATA: this term's timetable. Edit this table (or the courses in the app) to change it.
   ========================================================= */
const SUBJECTS = {   // subject code -> official name (used by the timetable scanner). Add your own.
  WEB101: 'WEB DEVELOPMENT',
  NET201: 'COMPUTER NETWORKS',
  DBS202: 'DATABASE SYSTEMS',
  SEC301: 'CYBER SECURITY',
  ETH101: 'PROFESSIONAL ETHICS',
  MOB302: 'MOBILE APPS'
};
const GENERIC_NAME = /^(lecture|tutorial|lab|workshop)/i;   // placeholder names from the class types
const subjectName = (code, cur) => SUBJECTS[String(code).toUpperCase().trim()] || cur;
const TERM = { name: 'October 2026', start: '2026-10-12', weeks: 14 };   // start = Monday of week 1
const TIMETABLE = [   // [code, name, colour]; sample data, edit it or the courses in the app
  ['WEB101', 'Lecture & Lab', 'coral'],
  ['NET201', 'Lecture & Lab', 'sky'],
  ['DBS202', 'Lecture & Lab', 'emerald'],
  ['SEC301', 'Lecture', 'violet'],
  ['ETH101', 'Lecture & Tutorial', 'tangerine'],
  ['MOB302', 'Lecture & Lab', 'magenta']
];
function seed() {
  const start = new Date(TERM.start + 'T00:00:00');
  const courses = TIMETABLE.map(([code, name, colour]) => ({
    id: code.toLowerCase(), code, name: subjectName(code, name), colour, instructor: '',
    weightings: [['Coursework', 50], ['Final exam', 50]].map(([label, pct]) => ({ id: uid(), label, pct }))
  }));
  return {
    version: 2,
    courses,
    assignments: [],
    timetable: [],
    settings: {
      dailyCapacityHrs: 4,
      semesterStart: toDateInput(start),
      semesterEnd: toDateInput(addDays(start, TERM.weeks * 7 - 1)),
      theme: document.documentElement.getAttribute('data-theme') || 'light'
    },
    archive: []
  };
}

/* =========================================================
   STORE
   ========================================================= */
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!s || !Array.isArray(s.courses) || !Array.isArray(s.assignments) || !s.settings) return null;
    if (s.version === 1 && s.courses.some(c => c.id === 'bio')) return null; // old demo data
    s.archive = s.archive || [];
    s.timetable = Array.isArray(s.timetable) ? s.timetable : [];
    s.courses.forEach(c => { if (GENERIC_NAME.test(c.name)) c.name = subjectName(c.code, c.name); });
    return s;
  } catch (e) { return null; }
}
let S = load() || seed();
function save(stamp = true) {
  if (stamp) S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (stamp) syncPush();
}
save(false); // seed/load write: no stamp, so a fresh device never beats the cloud copy

/* Cloud sync via the signed-in Puter account (puter.kv). Last write wins by updatedAt. Signed out = local only. */
const cloudOn = () => { try { return !!(window.puter && puter.auth.isSignedIn()); } catch (e) { return false; } };
let pushTimer = null;
function syncPush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { if (cloudOn()) puter.kv.set(KEY, JSON.stringify(S)).catch(() => {}); }, 1000);
}
async function syncPull() {
  if (!cloudOn()) return;
  try {
    const raw = await puter.kv.get(KEY);
    const r = raw ? JSON.parse(raw) : null;
    if (!r || !Array.isArray(r.courses) || !Array.isArray(r.assignments) || !r.settings) { if (S.updatedAt) syncPush(); return; }
    if ((r.updatedAt || 0) > (S.updatedAt || 0)) {
      r.archive = r.archive || []; r.timetable = Array.isArray(r.timetable) ? r.timetable : [];
      S = r; localStorage.setItem(KEY, JSON.stringify(S));
      renderRail(); renderMain(); renderDrawer();
    } else if ((r.updatedAt || 0) < (S.updatedAt || 0)) syncPush();
  } catch (e) {}
}

const ui = {
  route: 'today', courseId: null, search: '', drawerId: null, weekOffset: 0, calMonth: 0, calSel: null,
  sort: { key: 'dueAt', dir: 1 }, gPending: false, gTimer: null,
  quick: null, target: {}, importTab: 'text', importRows: null, toastTimer: null
};

const course = id => S.courses.find(c => c.id === id);
const asg = id => S.assignments.find(a => a.id === id);
const col = key => /^#[0-9a-f]{6}$/i.test(key) ? key : `var(--c-${key || 'ochre'})`;
const hexToHsv = x => { const r = parseInt(x.slice(1, 3), 16) / 255, g = parseInt(x.slice(3, 5), 16) / 255, b = parseInt(x.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b); let hu = 0;
  if (d) hu = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;

const isDone = a => a.status === 'Submitted' || a.status === 'Graded';
const byDue = (a, b) => new Date(a.dueAt) - new Date(b.dueAt);

/* =========================================================
   SMART BEHAVIOUR
   ========================================================= */
function remainingHrs(a) {

}

  if (hrs < 48) return `Due in ${Math.round(hrs)}h`;

}

function reminders(now) {

    if (isDone(a)) return false;

    if (d < now) return false;

}

}
function weekSuggestion(days, cap, now) {

    if (d.date < today) continue;
    const movable = d.items.filter(a => !isDone(a) && !FIXED.test(a.title)).sort((x, y) => remainingHrs(y) - remainingHrs(x));
    for (const a of movable) {

    const hrs = items.reduce((t, x) => t + (x.estimateHrs || 0), 0);

}
function gradeStats(courseId) {

  const graded = items.filter(a => a.status === 'Graded' && a.maxScore > 0 && a.score != null);
  const gW = graded.reduce((s, a) => s + (+a.weightPct || 0), 0);
  const earned = graded.reduce((s, a) => s + (a.score / a.maxScore) * (+a.weightPct || 0), 0);

function renderMain(opts = {}) {
  const main = $('#main');
  const act = document.activeElement;
  let restore = null;
  if (act && main.contains(act)) {
    if (act.matches('[data-row]')) restore = `[data-row][data-id="${act.dataset.id}"]`;
    else if (act.id) restore = '#' + CSS.escape(act.id);
  }
  let html;
  if (ui.search.trim()) html = viewSearch();
  else if (ui.route === 'week') html = viewWeek();
  else if (ui.route === 'semester') html = viewSemester();
  else if (ui.route === 'profile') html = viewProfile();
  else if (ui.route === 'course' && course(ui.courseId)) html = viewCourse();
  else html = viewToday();
  main.innerHTML = `<div class="page">${html}</div>`;
  if (opts.focusIndex != null) {
    const rows = $$('[data-row]', main);
    if (rows.length) rows[Math.min(opts.focusIndex, rows.length - 1)].focus();
  } else if (restore) { const el = $(restore, main); if (el) el.focus(); }
  if (ui.route === 'course') updateCourseCalc();
}

const ledgerHead = (dueLabel = 'Due') => `<thead><tr><th scope="col"><span class="sr-only">Submitted</span></th><th scope="col"><span class="hide-sm">Course</span></th><th scope="col">Assignment</th><th scope="col">${dueLabel}</th><th scope="col" class="num">Mark</th></tr></thead>`;

/* ---------- TODAY ---------- */
function viewToday() {
  const now = new Date();
  const open = S.assignments.filter(a => !isDone(a));
  const overdue = open.filter(a => new Date(a.dueAt) < now).sort(byDue);
  const upcoming = open.filter(a => { const d = new Date(a.dueAt); return d >= now && d - now <= 14 * DAY; }).sort(byDue); // Coming up: next 14 days only
  const within48 = upcoming.filter(a => new Date(a.dueAt) - now <= 48 * HOUR).length;
  const weekHrs = open.filter(a => new Date(a.dueAt) - now <= 7 * DAY).reduce((s, a) => s + remainingHrs(a), 0);
  const ranked = [...open].sort((a, b) => priority(b, now) - priority(a, now)).slice(0, 3);
  const wk = weekOfSem(now);

  const nowHTML = ranked.length ? `<ol class="now-list">${ranked.map((a, i) => {
    const c = course(a.courseId); const d = new Date(a.dueAt); const late = d < now;
    return `<li class="now-item" data-row data-id="${a.id}" tabindex="0">
      <span class="rank" aria-hidden="true">${i + 1}</span>
      <div class="now-title"><span class="sq" style="--c:${col(c?.colour)}"></span><span class="mono">${h(c?.code || '')}</span>
        <button class="title-link" data-action="open" data-id="${a.id}" tabindex="-1">${h(a.title)}</button></div>
      <p class="reason mono ${late ? 'late' : ''}">${dueIn(d, now)} · ${fmtPct(a.weightPct)} of grade</p>
    </li>`;
  }).join('')}</ol>` : `<p class="empty">Nothing due. Add an assignment <button class="link-btn" data-action="new">(N)</button>.</p>`;

  // group upcoming
  const groups = [];
  const push = (key, label, sub, a, opts = {}) => {
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, label, sub, items: [], ...opts }; groups.push(g); }
    g.items.push(a);
  };
  for (const a of upcoming) {
    const d = new Date(a.dueAt); const dd = dayDiff(d, now);
    if (dd === 0) push('d0', 'Today', fmtShort(d), a);
    else if (dd === 1) push('d1', 'Tomorrow', fmtShort(d), a);
    else if (dd <= 6) push('d' + dd, fmtShort(d), '', a);
    else { const ws = startOfWeek(d); push('w' + +ws, `Week of ${fmtDM(ws)}`, `W${weekOfSem(ws)}`, a, { showDay: true }); }
  }
  const tableHTML = (overdue.length || groups.length) ? `<table class="ledger">${ledgerHead()}
    ${overdue.length ? `<tbody><tr class="group late"><th colspan="6" scope="rowgroup">Overdue<span class="mono">${overdue.length}</span></th></tr>${overdue.map(a => rowHTML(a, now)).join('')}</tbody>` : ''}
    ${groups.map(g => `<tbody><tr class="group"><th colspan="6" scope="rowgroup">${h(g.label)}${g.sub ? `<span class="mono">${h(g.sub)}</span>` : ''}</th></tr>${g.items.map(a => rowHTML(a, now, { showDay: g.showDay })).join('')}</tbody>`).join('')}
  </table>` : `<p class="empty">Nothing due. Add an assignment <button class="link-btn" data-action="new">(N)</button>.</p>`;

  // side: next 7 days load + recently submitted
  const cap = +S.settings.dailyCapacityHrs || 4;
  const days = Array.from({ length: 7 }, (_, i) => dayLoad(addDays(sod(now), i)));
  const max = Math.max(cap * 1.5, ...days.map(d => d.load));
  const recent = S.assignments.filter(a => isDone(a) && new Date(a.dueAt) > addDays(now, -21) ).sort((a, b) => byDue(b, a)).slice(0, 5);

  const welcome = S.settings.welcomed ? '' : `
  <aside class="welcome" aria-label="Welcome">
    <h2 class="serif">Welcome to Ledger</h2>
    <p>Track assignments and see what to work on first.</p>
    <ol>
      <li>Tap <b>Add</b> and type like <i>“Lab report ${h(S.courses[0]?.code || 'ABC123')} fri 11:59pm 15% 3h”</i> to add one.</li>
      <li>Tap an assignment to edit it, add steps or notes. Tick the box when it’s handed in.</li>
      <li>Use the bar at the bottom: <b>Today</b> = what to do now, <b>Timetable</b> = your classes, <b>Term</b> = the whole semester, <b>Profile</b> = your details. Courses and <b>Settings</b> are in the sidebar.</li>
    </ol>
    <p class="muted">Your courses are set up from your timetable. Add assignments as you get them.</p>
    <div class="welcome-acts">
      <button class="btn primary" data-action="welcome-dismiss">Got it</button>
    </div>
  </aside>`;
  return `
  <header class="page-head">
    <p class="eyebrow mono">${termName()} · Week ${Math.min(Math.max(wk, 1), semWeeks())} of ${semWeeks()}</p>
    <h1 class="display">${fmtLong(now)}</h1>
    <p class="meta mono">${open.length} open · ${within48} due within 48h · ~${fmtH(weekHrs)} of work in the next 7 days${overdue.length ? ` · <span class="accent">${overdue.length} overdue</span>` : ''}</p>
  </header>
  ${welcome}
  <div class="today-grid">
    <div>
      <section aria-labelledby="h-now">
        <h2 class="section-h" id="h-now">Work on now <span class="mono">ranked by urgency × mark</span></h2>
        ${nowHTML}
      </section>
      <section aria-labelledby="h-up">
        <h2 class="section-h" id="h-up">Coming up <span class="mono">${upcoming.length} open</span></h2>
        ${tableHTML}
      </section>
    </div>
    <aside aria-label="Overview">
      <div class="side-block">
        <h2 class="side-h">Recently submitted</h2>
        ${recent.length ? `<ul class="done-list">${recent.map(a => `<li><span class="sq" style="--c:${col(course(a.courseId)?.colour)}"></span><span class="t">${h(a.title)}</span><button class="link-btn mono" style="font-size:11px" data-action="toggle-btn" data-id="${a.id}">Undo</button></li>`).join('')}</ul>` : `<p class="muted" style="margin:0;font-size:13px">Nothing submitted in the last three weeks.</p>`}
      </div>
    </aside>
  </div>
  ${calendarHTML(now)}`;
}

/* ---------- CALENDAR (Today page) ---------- */
function calendarHTML(now) {
  const base = new Date(now.getFullYear(), now.getMonth() + ui.calMonth, 1);
  const start = startOfWeek(base);
  const sel = ui.calSel ? fromDateInput(ui.calSel) : sod(now);
  const byDay = {};
  S.assignments.forEach(a => { (byDay[toDateInput(new Date(a.dueAt))] ||= []).push(a); });
  const isLate = a => !isDone(a) && new Date(a.dueAt) < now;
  // one soft light travels at constant speed (STEP s per day) from the start date to the due date, rests 2s, repeats.
  // Each day cell shows the band while its centre is within 0.8 cell of the cell centre, so neighbours hand it over seamlessly.
  const STEP = 0.5, kf = [], kfIdx = new Map(), T = performance.now() / 1000; // T: page clock, so a re-render resumes the glint mid-sweep instead of restarting it
  const glint = a => {
    if (kfIdx.has(a.id)) return kfIdx.get(a.id);
    const n = Math.round((sod(new Date(a.dueAt)) - sod(new Date(a.startAt))) / 864e5) + 1, per = (n + 0.6) * STEP + 2, g = 'g' + kfIdx.size;
    kf.push(`@keyframes ${g}{0%{transform:translateX(-80%)}${(1.6 * STEP / per * 100).toFixed(2)}%,100%{transform:translateX(80%)}}`);
    const r = { g, per }; kfIdx.set(a.id, r); return r;
  };
  // Lanes: each assignment keeps ONE row for its whole span, so its bar runs straight to the deadline. Oldest gets lane 0 = the very bottom row.
  const kS = a => toDateInput(new Date(a.startAt)), kE = a => toDateInput(new Date(a.dueAt));
  const lane = new Map(), placed = [];
  S.assignments.filter(a => a.startAt).sort((x, y) => (new Date(x.startAt) - new Date(y.startAt)) || (new Date(x.createdAt || x.startAt) - new Date(y.createdAt || y.startAt))).forEach(a => {
    let l = 0; while (placed.some(p => p.l === l && kS(p.a) <= kE(a) && kS(a) <= kE(p.a))) l++;
    lane.set(a.id, l); placed.push({ a, l });
  });
  // every day in a week renders the same number of rows, so lanes line up across the week
  const weekRows = Array.from({ length: 6 }, (_, w) => {
    const w0 = toDateInput(addDays(start, w * 7)), w1 = toDateInput(addDays(start, w * 7 + 6));
    return Math.max(-1, ...S.assignments.filter(a => a.startAt && kS(a) <= w1 && kE(a) >= w0).map(a => lane.get(a.id)));
  });
  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = addDays(start, i), k = toDateInput(d), items = (byDay[k] || []).sort(byDue);
    const byLane = new Map(S.assignments.filter(a => a.startAt && kS(a) <= k && k <= kE(a)).map(a => [lane.get(a.id), a]));
    const spans = Array.from({ length: weekRows[Math.floor(i / 7)] + 1 }, (_, l) => byLane.get(l)).reverse().map(a => {
      if (!a) return '<span class="cal-span gap" aria-hidden="true"></span>';
      const first = k === kS(a), last = k === kE(a);
      const gl = glint(a), idx = Math.max(0, Math.round((d - sod(new Date(a.startAt))) / 864e5));
      return `<span class="cal-span${first ? ' first' : ''}${last ? ' last' : ''}${isDone(a) ? ' done' : ''}" style="--c:${col(course(a.courseId)?.colour)};--g:${gl.g};--per:${gl.per}s;--del:${(idx * STEP - T).toFixed(3)}s">${first || d.getDay() === 1 ? h(a.title) : ''}</span>`;
    }).join('');
    const cls = [d.getMonth() !== base.getMonth() && 'out', +d === +sod(now) && 'today', +d === +sel && 'sel', items.some(isLate) && 'late', items.length && 'has'].filter(Boolean).join(' ');
    return `<button class="cal-day ${cls}" data-action="cal-pick" data-date="${k}" aria-pressed="${+d === +sel}" aria-label="${fmtLong(d)}, ${items.length ? items.length + ' due' : 'nothing due'}">
      <span class="cal-n">${d.getDate()}</span>
      ${spans ? `<span class="cal-spans">${spans}</span>` : ''}
      <span class="cal-items">${items.slice(0, 2).map(a => `<span class="cal-chip ${isDone(a) ? 'done' : ''} ${isLate(a) ? 'late' : ''}" style="--c:${col(course(a.courseId)?.colour)}">${h(a.title)}</span>`).join('')}${items.length > 2 ? `<span class="cal-more">+${items.length - 2} more</span>` : ''}</span>
      <span class="cal-dots" aria-hidden="true">${items.slice(0, 3).map(a => `<i style="--c:${col(course(a.courseId)?.colour)}"></i>`).join('')}</span>
    </button>`;
  }).join('');
  const selK = toDateInput(sel);
  const list = S.assignments.filter(a => toDateInput(new Date(a.dueAt)) === selK || (a.startAt && toDateInput(new Date(a.startAt)) <= selK && selK <= toDateInput(new Date(a.dueAt)))).sort(byDue); // due that day, or running through it
  const monthCount = S.assignments.filter(a => { const d = new Date(a.dueAt); return d.getMonth() === base.getMonth() && d.getFullYear() === base.getFullYear() && !isDone(a); }).length;
  return `
  <section class="cal" id="cal" aria-label="Calendar">
    <div class="cal-main">
      <div class="cal-head">
        <h2 class="cal-title">${MO[base.getMonth()]} <span>${base.getFullYear()}</span></h2>
        <span class="cal-sub mono">${monthCount} open due this month</span>
        <div class="cal-nav">
          <button class="cal-ic" data-action="cal-step" data-n="-1" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="cal-today-btn" data-action="cal-now">Today</button>
          <button class="cal-ic" data-action="cal-step" data-n="1" aria-label="Next month"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="cal-dow" aria-hidden="true">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<span>${d}</span>`).join('')}</div>
      <style>${kf.join('')}</style>
      <div class="cal-grid">${cells}</div>
    </div>
    <aside class="cal-side" aria-live="polite">
      <div class="cal-side-head">
        <div><h3>${+sel === +sod(now) ? 'Due today' : 'Due'}</h3><p class="mono">${fmtLong(sel)} ${sel.getFullYear()}</p></div>
        <button class="cal-ic" data-action="cal-add" aria-label="Add assignment due ${fmtLong(sel)}"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      ${list.length ? list.map(a => {
        const c = course(a.courseId), d = new Date(a.dueAt);
        return `<button class="cal-card ${isDone(a) ? 'done' : ''} ${isLate(a) ? 'late' : ''}" style="--c:${col(c?.colour)}" data-action="open" data-id="${a.id}">
          <span class="cal-card-bar"></span>
          <b>${h(a.title)}</b>
          <span class="cal-card-sub">${h(c?.code || '')}${c?.name ? ' · ' + h(c.name) : ''}</span>
          <span class="cal-card-row"><span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Due ${toDateInput(d) === selK ? '' : fmtShort(d) + ' '}${fmtTime(d)}</span><span class="${isLate(a) ? 'accent' : ''}">${isDone(a) ? h(a.status) : dueIn(d, now)}</span></span>
          <span class="cal-card-row muted"><span>${a.weightPct ? fmtPct(a.weightPct) + ' of grade' : 'No mark set'}</span><span>${isDone(a) ? '' : '~' + fmtH(remainingHrs(a)) + ' left'}</span></span>
        </button>`;
      }).join('') : `<p class="cal-empty">Nothing due this day.</p>`}
    </aside>
  </section>`;
}
function renderCal(focusDate) {
  const el = $('#cal'); if (!el) return;
  el.outerHTML = calendarHTML(new Date());
  if (focusDate) $(`.cal-day[data-date="${focusDate}"]`)?.focus();
}

/* ---------- WEEK ---------- */
const TT_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const TT_TYPES = { L: 'Lecture', T: 'Tutorial', B: 'Lab', W: 'Workshop' };
const toMin = s => { const [a, b] = String(s || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
function viewWeek() {
  const tt = S.timetable || [];
  const todayIdx = (new Date().getDay() + 6) % 7;
  // hour range grows to fit the classes; 08:00-18:00 when empty
  const lo = Math.min(8, ...tt.map(x => Math.floor(toMin(x.start) / 60)));
  const hi = Math.max(18, ...tt.map(x => Math.ceil(toMin(x.end) / 60)));
  const slots = (hi - lo) * 2; // 30-minute columns
  const colOf = m => Math.round((m - lo * 60) / 30) + 1;
  const days = TT_DAYS.map((_, i) => i).filter(i => i < 5 || tt.some(x => +x.day === i)); // weekend only if used
  const hours = Array.from({ length: slots }, (_, i) => lo * 60 + i * 30); // a label every 30 minutes
  return `
  <header class="page-head">
    <div class="head-row">
      <div>
        <p class="eyebrow mono">${h(termName())} · ${tt.length} ${tt.length === 1 ? 'class' : 'classes'} a week</p>
        <h1 class="display">Timetable</h1>
      </div>
      <div class="week-tools"><button class="btn primary small" data-action="tt-add">+ Add class</button></div>
    </div>
  </header>
  <div class="tt-wrap"><div class="tt" style="--slots:${slots};--hrs:${hi - lo}">
    <div class="tt-row tt-headrow"><div class="tt-dl"></div><div class="tt-hours">${hours.map(m => `<span class="mono${m % 60 ? ' half' : ''}">${pad(Math.floor(m / 60))}:${pad(m % 60)}</span>`).join('')}</div></div>
    ${days.map(d => `<div class="tt-row${d === todayIdx ? ' is-today' : ''}">
      <div class="tt-dl mono">${TT_DAYS[d]}</div>
      <div class="tt-lane" data-day="${d}">${tt.filter(x => +x.day === d).sort((a, b) => toMin(a.start) - toMin(b.start)).map(x => {
        const c = course(x.courseId);
        return `<button class="tt-cls" data-action="tt-edit" data-id="${h(x.id)}" style="--c:${col(c?.colour)};grid-column:${colOf(toMin(x.start))} / ${colOf(toMin(x.end))}">
          <b>${h(c?.name || c?.code || '?')}</b>
          <span class="mono">${h(c?.code || '')}</span>
          <span>${h(x.start)}–${h(x.end)}</span>
          ${x.room ? `<span>Room: ${h(x.room)}</span>` : ''}<span class="tt-type">${h(TT_TYPES[x.type] || 'Lecture')}</span>${x.group ? `<span>Group: ${h(x.group)}</span>` : ''}${x.lecturer ? `<span>${h(x.lecturer)}</span>` : ''}
        </button>`; }).join('')}</div>
    </div>`).join('')}
  </div></div>
  <p class="mono muted" style="margin-top:12px">${Object.entries(TT_TYPES).map(([k, v]) => `${k} = ${v}`).join(', ')}. Tap a class to edit it. Colours come from each course.</p>
  ${tt.length ? '' : `<p class="empty">No classes yet. Add them from your university timetable with <button class="link-btn" data-action="tt-add">+ Add class</button>.</p>`}`;
}

/* ---------- SEMESTER ---------- */
function viewSemester() {
  const now = new Date();
  const s = semStart(), e = semEnd(), span = e - s, n = semWeeks();
  const pct = d => ((new Date(d) - s) / span * 100);
  const weeks = crunchWeeks();
  const crunch = weeks.filter(w => w.crunch);
  const todayPct = pct(now);
  const showToday = todayPct >= 0 && todayPct <= 100;
  const scaffold = (head) => `
    ${weeks.map(w => `<div class="tl-wk" style="left:${pct(w.start).toFixed(3)}%"></div>`).join('')}
    ${crunch.map(w => `<div class="tl-band" style="left:${pct(w.start).toFixed(3)}%;width:${(pct(w.end) - pct(w.start)).toFixed(3)}%"></div>`).join('')}
    ${showToday ? `<div class="tl-today" style="left:${todayPct.toFixed(3)}%"></div>` : ''}
    ${head ? weeks.map(w => `<div class="tl-wk-label" style="left:${pct(w.start).toFixed(3)}%"><b>W${w.w + 1}</b>${fmtDM(w.start)}</div>`).join('') : ''}`;
  return `
  <header class="page-head">
    <div class="head-row">
      <div>
        <p class="eyebrow mono">${n} weeks · ${S.assignments.length} assignments · ${crunch.length} crunch ${crunch.length === 1 ? 'week' : 'weeks'}</p>
        <h1 class="display">${termName()}</h1>
      </div>
      <div class="sem-tools">
        <label for="sem-start">Starts <input type="date" id="sem-start" value="${S.settings.semesterStart}"></label>
        <label for="sem-end">Ends <input type="date" id="sem-end" value="${S.settings.semesterEnd}"></label>
      </div>
    </div>
  </header>
  <div class="tl-scroll">
    <div class="tl" role="group" aria-label="Semester timeline">
      <div class="tl-row tl-head"><div class="tl-label mono">Course</div><div class="tl-track">${scaffold(true)}</div></div>
      ${S.courses.map(c => {
        const items = S.assignments.filter(a => a.courseId === c.id);
        return `<div class="tl-row"><div class="tl-label"><span class="sq" style="--c:${col(c.colour)}"></span><a href="#/course/${h(c.id)}"><span class="mono code">${h(c.code)}</span></a></div>
          <div class="tl-track">${scaffold(false)}

                title="${h(c.code)} · ${h(a.title)} · ${fmtShort(d)} · ${fmtPct(a.weightPct)}" aria-label="${h(c.code)} ${h(a.title)}, due ${fmtShort(d)}, ${fmtPct(a.weightPct)} of grade${isDone(a) ? ', ' + a.status.toLowerCase() : ''}"></button>`;
            }).join('')}

      }).join('')}
    </div>
  </div>
  <div class="tl-legend">

  </div>
  <section aria-labelledby="h-crunch" style="margin-top:40px">

      ${crunch.map(w => `<tr><td class="mono">W${w.w + 1}</td><td class="mono" style="white-space:nowrap">${fmtDM(w.start)} – ${fmtDM(addDays(w.end, -1))}</td>
        <td>${w.items.sort(byDue).map(a => `<button class="title-link" data-action="open" data-id="${a.id}">${h(course(a.courseId)?.code || '')} ${h(a.title)}</button>`).join('<span class="muted"> · </span>')}</td>
        <td class="num">${w.items.length}</td><td class="num">${fmtH(w.hrs)}</td></tr>`).join('')}
    </tbody></table>` : `<p class="empty">No crunch weeks this term.</p>`}
  </section>`;
}

/* ---------- COURSE ---------- */
function viewCourse() {
  const c = course(ui.courseId);
  const st = gradeStats(c.id);
  const now = new Date();
  const wTotal = c.weightings.reduce((s, w) => s + (+w.pct || 0), 0);
  const { key, dir } = ui.sort;
  const val = a => key === 'pct' ? (a.status === 'Graded' && a.maxScore ? a.score / a.maxScore : -1)
    : key === 'dueAt' ? +new Date(a.dueAt) : key === 'status' ? STATUSES.indexOf(a.status) : key === 'title' ? a.title.toLowerCase() : +a[key] || 0;
  const items = st.items.slice().sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  const th = (k, label, cls = '') => `<th scope="col" class="${cls}" ${key === k ? `aria-sort="${dir === 1 ? 'ascending' : 'descending'}"` : ''}><button class="sort-btn" data-action="sort" data-key="${k}">${label}${key === k ? (dir === 1 ? ' ↑' : ' ↓') : ''}</button></th>`;
  return `

          </tr>`;
        }).join('')}</tbody></table>`

function updateCourseCalc() {
  const c = course(ui.courseId); const out = $('#calc-out'); if (!c || !out) return;
  const st = gradeStats(c.id);
  const target = num($('#target')?.value, 80);
  ui.target[c.id] = target;
  const note = $('#calc-note');
  if (st.remainingW <= 0.01) { out.textContent = `Everything is graded. Final: ${(st.earned).toFixed(1)}%.`; note.textContent = ''; return; }
  const need = (target - st.earned) / st.remainingW * 100;
  if (need <= 0) out.textContent = `Already secured. Any result on the remaining ${fmtPct(st.remainingW)} gets you ${target}%.`;
  else if (need > 100) out.textContent = `Not reachable: you would need ${need.toFixed(1)}% on the remaining ${fmtPct(st.remainingW)}.`;
  else out.innerHTML = `You need an average of <strong>${need.toFixed(1)}%</strong> on the remaining ${fmtPct(st.remainingW)}.`;
  const ungradedTracked = st.items.filter(a => a.status !== 'Graded').reduce((s, a) => s + (+a.weightPct || 0), 0);
  note.textContent = Math.abs(ungradedTracked - st.remainingW) > 0.5
    ? `Your tracked ungraded work covers ${fmtPct(ungradedTracked)} of that ${fmtPct(st.remainingW)}.` : '';
}

const SCAN_MAX_MB = 15, SCAN_MAX_PAGES = 100, SCAN_BATCH = 4, SCAN_MAX_IMAGES = 20, SCAN_MAX_PDFS = 5;
const isPdfFile = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
function loadPdfJs() { // pdf.js loads on first PDF only
  return window.pdfjsLib ? Promise.resolve() : new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(); };

/* Picture -> [[dataURL]]; PDF -> pages rendered to JPEG, grouped SCAN_BATCH per AI call */
async function fileToBatches(file) {
  const isPdf = isPdfFile(file);
  if (!isPdf && !file.type.startsWith('image/')) throw new Error('type');
  if (file.size > SCAN_MAX_MB * 1048576) throw new Error('size');
  if (!isPdf) return [[await readURL(file)]];
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  if (pdf.numPages > SCAN_MAX_PAGES) throw new Error('pages');
  const batches = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n), vp = page.getViewport({ scale: 1.5 });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    if (n % SCAN_BATCH === 1 || !batches.length) batches.push([]);
    batches[batches.length - 1].push(cv.toDataURL('image/jpeg', 0.8));
  }
  return batches;
}
async function aiRows(files, prompt) {
  if (!window.puter) throw new Error('Puter failed to load');
  const pdfs = files.filter(isPdfFile).length;
  if (pdfs > SCAN_MAX_PDFS) throw new Error('pdfs');
  if (files.length - pdfs > SCAN_MAX_IMAGES) throw new Error('images');
  const rows = [];
  for (const file of files) for (const imgs of await fileToBatches(file)) {
    const res = await puter.ai.chat(prompt, imgs, { model: 'claude-haiku-5-5' });
    const raw = typeof res === 'string' ? res : (res?.message?.content?.[0]?.text ?? res?.message?.content ?? '');
    try { rows.push(...JSON.parse(String(raw).match(/\[[\s\S]*\]/)[0])); } catch (e) { /* that batch had nothing readable */ }
  }
  return rows;
}

function scanTimetable(files) {

    const norm = x => String(x || '').toLowerCase().replace(/\s+/g, '');

      let c = S.courses.find(x => (code && norm(x.code) === norm(code)) || (!code && nm && norm(x.name) === norm(nm)));
      if (!c) { // unknown subject: make a course for it
        const used = S.courses.map(x => x.colour), colour = (COLOURS.find(k => !used.includes(k.key)) || COLOURS[S.courses.length % 6]).key;
